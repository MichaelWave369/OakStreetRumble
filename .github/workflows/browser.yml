name: Browser shell

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:html
      - run: test -s Oak-Street-Rumble.html
